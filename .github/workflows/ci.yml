name: AI Translator CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    name: Code Quality & Docker Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Lint Code (Flake8)
      run: |
        echo "Corriendo análisis estático de código..."
        # Detiene el pipeline si hay errores de sintaxis graves
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Trata el resto de errores como advertencias
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run Unit Tests (Pytest)
      run: |
        echo "Ejecutando pruebas automatizadas..."
        pytest "test/Unit Tests/test_app.py" -v

    - name: Build Docker Image
      run: |
        echo "Construyendo la imagen de Docker..."
        docker build -t ai-terraform-translator:latest .
        echo "¡Imagen construida exitosamente!"